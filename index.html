    <script>
      // Automatic trailing-slash correction for GitHub Pages subdirectories
      // Prevents 404 on assets when accessed as https://user.github.io/repo instead of https://user.github.io/repo/
      (function() {
        var pathname = window.location.pathname;
        if (!pathname.endsWith('/') && !pathname.split('/').pop().includes('.')) {
          window.location.replace(pathname + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
